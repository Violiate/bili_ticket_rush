[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.23.0", features = ["default"] }

# 字体依赖
egui_extras = { version = "0.23.0", features = ["all_loaders"] }

# 剪贴板读取（复用工作区已锁定的 arboard 版本）
arboard = "3.4"

# 背景图片
image = "0.25"

# 时间
chrono = "0.4"

# 日志
log = "0.4"

# 序列化
base64 = "0.13"

# str转二维码
qrcode = "0.14.1"

# 网络请求
reqwest = { version = "0.11.22", features = ["json", "blocking", "cookies"] }
tokio = { version = "1", features = ["full"] }

# rand
rand = "0.8"

# json
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# jsonwebtoken
jsonwebtoken = "9"

common = { path = "../common" }
backend = { path = "../backend" }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }

[features]
default = []
# 顶层开关：用 `cargo build --release --features tls-impersonate` 启用浏览器 TLS 指纹伪装。
tls-impersonate = ["common/tls-impersonate", "backend/tls-impersonate"]
